[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arxiv-research-digest"
version = "0.1.0"
description = "Daily arXiv discovery and cloud-LLM research digest service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "aiosmtplib>=4.0,<5",
  "aiosqlite>=0.21,<1",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "sqlalchemy>=2.0.43,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
arxiv-digest-api = "app.api:main"
arxiv-digest-backup = "app.maintenance:main"
arxiv-digest-worker = "app.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
